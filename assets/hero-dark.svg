<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Jhostin — Software, AI, Open Source</title>
  <desc id="desc">A dark cyber landscape leading to a developer workstation.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity=".15"/>
      <stop offset=".62" stop-color="#0d1117" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity=".82"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="430" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <image href="hero-scene.png" width="1200" height="484" x="0" y="-25" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1200" height="430" fill="url(#shade)"/>
    <path d="M60 58h64M60 58v64M1140 58h-64M1140 58v64M60 372h64M60 372v-64M1140 372h-64M1140 372v-64" fill="none" stroke="#39d9ff" stroke-width="2" opacity=".6"/>
    <text x="600" y="112" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="5">SOFTWARE · AI · OPEN SOURCE</text>
    <text x="600" y="190" text-anchor="middle" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="66" font-weight="700" letter-spacing="14">JHOSTIN</text>
    <text x="600" y="235" text-anchor="middle" fill="#39d9ff" filter="url(#glow)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">&gt; ./build_future<tspan fill="#e6edf3">_</tspan></text>
    <rect x="1" y="1" width="1198" height="428" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
  </g>
</svg>

